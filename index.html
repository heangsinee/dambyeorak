<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#eee1c6"><title>담벼락</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;font-family:ui-rounded,"Apple SD Gothic Neo",sans-serif;color:#29241e;background:#eee1c6}button,input{font:inherit}.hide{display:none!important}#home{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(90deg,#00000008 1px,transparent 1px),#eee1c6;background-size:34px 34px}.hero{width:min(520px,100%);text-align:center}.logo{font-size:58px;letter-spacing:-6px;margin:8px 0;transform:rotate(-2deg)}.tag{color:#655c50;margin-bottom:30px}.card{border:2px solid #3b342c;background:#f8efd9;padding:22px;border-radius:7px;box-shadow:7px 8px 0 #463d3022}.btn{border:2px solid #332d26;background:#fff8e8;padding:14px;border-radius:6px;font-weight:800;box-shadow:3px 3px 0 #332d26}.primary{background:#302c27;color:#fff;width:100%}.join{display:flex;gap:9px;margin-top:14px}.join input{min-width:0;flex:1;padding:13px;border:2px solid #332d26;border-radius:6px;text-align:center;letter-spacing:4px;background:#fffdf4}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#eee1c6ef;border-bottom:1px dashed #766b5c;backdrop-filter:blur(8px)}header .title{flex:1}.tiny{font-size:12px;opacity:.65}.plain{border:0;background:transparent;font-size:22px}.share{border:1px solid #665e53;background:#faf0dc;padding:8px 10px;border-radius:6px}#wrap{position:relative;min-height:2400px;width:min(760px,100%);margin:auto;background:linear-gradient(#00000008 1px,transparent 1px),linear-gradient(90deg,#00000006 1px,transparent 1px),#eee1c6;background-size:42px 42px}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hint{position:absolute;top:35px;left:50%;transform:translateX(-50%) rotate(-2deg);opacity:.38;font-weight:800;pointer-events:none;white-space:nowrap}.toolbar{position:fixed;z-index:20;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-5 </style></head><body><div id="toast"></div><section id="home"><div class="hero"><div>온라인 손글씨 방명록</div><h1 class="logo">담벼락</h1><p class="tag">말 대신, 손글씨를 남겨요.</p><div class="card"><button id="create" class="btn primary">새 담벼락 만들기</button><div class="join"><input id="code" maxlength="6" inputmode="numeric" placeholder="초대코드 6자리"><button id="join" class="btn">들어가기</button></div></div><p class="tiny" style="margin-top:24px">손가락 · Apple Pencil · 마우스로 슥슥</p></div></section>
<section id="wallPage" class="hide"><header><button id="back" class="plain">←</button><div class="title"><b id="roomTitle">우리의 담벼락</b><div class="tiny">초대코드 <span id="roomCode"></span></div></div><button id="share" class="share">공유</button></header><main id="wrap"><div class="hint">여기 아무 데나 손글씨를 남겨봐</div><canvas id="wall"></canvas></main><div class="toolbar"><button class="dot active" data-c="#29241e" style="background:#29241e"></button><button class="dot" data-c="#bd5d4d" style="background:#bd5d4d"></button><button class="dot" data-c="#65785d" style="background:#65785d"></button><button class="dot" data-c="#64788d" style="background:#64788d"></button><button id="thin" class="tool">얇게</button><button id="thick" class="tool">굵게</button><button id="undo" class="tool">↶</button><button id="clear" class="tool">지우기</button><button id="save" class="tool save">남기기</button></div></section>
<dialog id="who"><h3>누가 남겼나요?</h3><input id="name" maxlength="20" placeholder="비우면 익명"><div class="row"><button id="cancel" class="tool">취소</button><button id="confirm" class="btn">남기기</button></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=s=>document.querySelector(s),toast=m=>{let t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)};const sb=(window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&!window.SUPABASE_URL.includes("붙여넣기"))?supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;let room,color="#29241e",width=4,drawing=false,current=[],local=[],remote=[],channel;const canvas=$("#wall"),ctx=canvas.getContext("2d"),wrap=$("#wrap");
function line(s){if(!s.points||s.points.length<2)return;ctx.beginPath();ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.moveTo(s.points[0].x,s.points[0].y);s.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke()}function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);remote.forEach(d=>(d.stroke_data||[]).forEach(line));local.forEach(line)}function fit(){let d=Math.min(devicePixelRatio||1,2),r=wrap.getBoundingClientRect();canvas.width=r.width*d;canvas.height=wrap.offsetHeight*d;canvas.style.width=r.width+"px";canvas.style.height=wrap.offsetHeight+"px";ctx.setTransform(d,0,0,d,0,0);redraw()}function pt(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);current=[pt(e)]};canvas.onpointermove=e=>{if(!drawing)return;current.push(pt(e));redraw();line({color,width,points:current})};canvas.onpointerup=()=>{if(!drawing)return;drawing=false;if(current.length>1)local.push({color,width,points:current});current=[];redraw()};document.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{document.querySelectorAll(".dot").forEach(x=>x.classList.remove("active"));b.classList.add("active");color=b.dataset.c});$("#thin").onclick=()=>width=3;$("#thick").onclick=()=>width=8;$("#undo").onclick=()=>{local.pop();redraw()};$("#clear").onclick=()=>{if(confirm("지금 그리고 있는 내용을 지울까?")){local=[];redraw()}};
async function createRoom(){if(!sb)return toast("config.js에 Supabase 연결값을 넣어줘");let {data,error}=await sb.from("rooms").insert({title:"우리의 담벼락"}).select().single();if(error)return toast(error.message);openRoom(data)}async function joinRoom(code){if(!sb)return toast("Supabase 연결이 먼저야");let {data,error}=await sb.from("rooms").select("*").eq("invite_code",code).maybeSingle();if(error||!data)return toast("담벼락을 못 찾았어");openRoom(data)}async function load(){let {data}=await sb.from("drawings").select("*").eq("room_id",room.id).order("created_at");remote=data||[];redraw()}async function openRoom(r){room=r;$("#home").classList.add("hide");$("#wallPage").classList.remove("hide");$("#roomTitle").textContent=r.title;$("#roomCode").textContent=r.invite_code;history.replaceState(null,"","?room="+r.invite_code);await load();fit();if(channel)sb.removeChannel(channel);channel=sb.channel("room-"+r.id).on("postgres_changes",{event:"*",schema:"public",table:"drawings",filter:"room_id=eq."+r.id},load).subscribe()}$("#create").onclick=createRoom;$("#join").onclick=()=>joinRoom($("#code").value.trim());$("#back").onclick=()=>location.href=location.pathname;$("#share").onclick=async()=>{let text="담벼락에 손글씨 남겨줘! 초대코드 "+room.invite_code;if(navigator.share){try{return await navigator.share({title:"담벼락",text,url:location.href})}catch(e){}}await navigator.clipboard.writeText(location.href);toast("초대 링크 복사 완료!")};$("#save").onclick=()=>{if(!local.length)return toast("먼저 손글씨를 남겨줘");$("#who").showModal()};$("#cancel").onclick=()=>$("#who").close();$("#confirm").onclick=async()=>{let name=$("#name").value.trim()||"익명";let {error}=await sb.from("drawings").insert({room_id:room.id,author_name:name,stroke_data:local,position_y:scrollY});if(error)return toast(error.message);local=[];$("#who").close();toast("담벼락에 남겼어!");await load()};addEventListener("resize",fit);(async()=>{let c=new URLSearchParams(location.search).get("room");if(c&&sb)await joinRoom(c)})();
</script></body></html>
